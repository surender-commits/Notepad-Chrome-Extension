<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Side Panel</title>
    <link rel="stylesheet" href="sidepanel.css">
</head>

<body>
    <section class="copy_txt_box_wrapper">

        <textarea id="copy_txt" class="tx"></textarea>

        <section class="paste_copy_btn_box">

            <div class="btn" id="paste_btn">Paste</div>

            <div class="btn" id="copy_btn">Copy</div>

        </section>

    </section>

    <section class="hr">
        <hr>
    </section>

    <section class="txt_box_wrapper">

        <textarea id="txt" class="tx"></textarea>

        <section class="btn_box">
            <div class="btn" id="A-">A-</div>
            <div class="btn" id="A">A</div>
            <div class="btn" id="A+">A+</div>
            <div class="btn" id="clear_all">Clear All</div>
        </section>

    </section>


    <script src="sidepanel.js"></script>

</body>

</html>
